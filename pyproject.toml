[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmox"
version = "0.2.0"
description = "A friendly, AI-friendly CLI to explore and manage a Proxmox VE cluster."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Ward" }]
keywords = ["proxmox", "pve", "virtualization", "homelab", "infrastructure", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "proxmoxer>=2.0",
    "requests>=2.28",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pmox = "pmox.cli:main"

[project.urls]
Homepage = "https://github.com/lukebward/pmox"
Repository = "https://github.com/lukebward/pmox"
Issues = "https://github.com/lukebward/pmox/issues"
Changelog = "https://github.com/lukebward/pmox/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pmox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pmox --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["pmox"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
