[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmox"
version = "0.1.0"
description = "A friendly, AI-friendly CLI to explore and manage a Proxmox VE cluster."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luke Ward" }]
dependencies = [
    "proxmoxer>=2.0",
    "requests>=2.28",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pmox = "pmox.cli:main"

[tool.setuptools.packages.find]
include = ["pmox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pmox --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["pmox"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
